<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFile Manager</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      color: #cbd5e1;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #94a3b8;
      border-radius: 16px;
      padding: 35px;
      text-align: center;
      margin-bottom: 25px;
    }

    .upload-box h2 {
      margin-bottom: 10px;
    }

    .upload-box p {
      color: #64748b;
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: none;
    }

    .upload-btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .upload-btn:hover {
      background: #1d4ed8;
    }

    .files {
      background: white;
      border-radius: 16px;
      padding: 20px;
    }

    .files h2 {
      margin-bottom: 15px;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    .file-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-name {
      font-weight: bold;
    }

    .file-size {
      color: #64748b;
      font-size: 13px;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #b91c1c;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 30px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <header>
    <h1>SmartFile Manager</h1>
    <p>Simple and smart file management</p>
  </header>

  <main class="container">

    <section class="upload-box">
      <h2>Add Your Files</h2>
      <p>Select files from your device to manage them.</p>

      <label for="fileInput" class="upload-btn">
        Select Files
      </label>

      <input
        type="file"
        id="fileInput"
        multiple
      >
    </section>

    <section class="files">
      <h2>My Files</h2>

      <div id="fileList" class="file-list">
        <div class="empty">
          No files selected yet.
        </div>
      </div>
    </section>

  </main>

  <footer>
    SmartFile Manager
  </footer>

  <script>
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");

    let files = [];

    fileInput.addEventListener("change", function () {
      const selectedFiles = Array.from(this.files);

      files = [...files, ...selectedFiles];

      displayFiles();
    });

    function displayFiles() {
      fileList.innerHTML = "";

      if (files.length === 0) {
        fileList.innerHTML =
          '<div class="empty">No files selected yet.</div>';
        return;
      }

      files.forEach((file, index) => {

        const item = document.createElement("div");
        item.className = "file-item";

        const info = document.createElement("div");
        info.className = "file-info";

        const name = document.createElement("div");
        name.className = "file-name";
        name.textContent = file.name;

        const size = document.createElement("div");
        size.className = "file-size";
        size.textContent = formatSize(file.size);

        info.appendChild(name);
        info.appendChild(size);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", function () {
          files.splice(index, 1);
          displayFiles();
        });

        item.appendChild(info);
        item.appendChild(deleteButton);

        fileList.appendChild(item);
      });
    }

    function formatSize(bytes) {
      if (bytes === 0) return "0 Bytes";

      const units = [
        "Bytes",
               "KB",
        "MB",
        "GB"
      ];

      const i = Math.floor(
        Math.log(bytes) / Math.log(1024)
      );

      return (
        (bytes / Math.pow(1024, i)).toFixed(2)
        + " "
        + units[i]
      );
    }
  </script>

</body>
</html>
